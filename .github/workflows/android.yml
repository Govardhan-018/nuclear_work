name: Android

# Builds an installable APK. Push to a branch for a debug build you can
# sideload; push a tag like v1.0.1 for a signed release attached to a GitHub
# Release, which is how app updates reach the phone.
on:
  push:
    branches: ["main", "claude/**", "android-app"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Also build a signed release APK"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still includes the long-removed
          # "tools" package, which makes sdkmanager exit 1. Install nothing
          # extra and let the Gradle plugin pull down the platform and
          # build-tools it needs.
          packages: ""

      - name: Accept SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build web assets
        env:
          VITE_MAYA_API_URL: ${{ vars.VITE_MAYA_API_URL || 'https://nuclear-work.onrender.com' }}
        run: pnpm build

      - name: Sync Capacitor
        run: npx cap sync android

      # A version derived from the run number so every build is installable
      # over the last one without uninstalling first.
      - name: Derive version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maya-debug-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Release signing only runs when the keystore secret is configured.
      - name: Decode keystore
        id: keystore
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set; skipping the signed build."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.keystore.outputs.available == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename release APK
        if: steps.keystore.outputs.available == 'true'
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             "maya-${{ steps.version.outputs.name }}.apk"

      - name: Upload release APK
        if: steps.keystore.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maya-release-${{ steps.version.outputs.name }}
          path: maya-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: maya-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
          body: |
            Install by downloading the APK below on your phone and opening it.
            Android will ask you to allow installs from this source the first time.

            Updating over a previous install keeps all your data.
